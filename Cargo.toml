[package]
name = "clipvault-sequential"
description = "Sequential clipboard GUI for Wayland"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
autobins = false
autolib = false
autotests = false
autobenches = false
include = [
  "/src/bin/clipvault-sequential.rs",
  "/README.md",
  "/LICENSE.md",
]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
] }
evdev = "0.13.2"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }

[[bin]]
name = "clipvault-sequential"
path = "src/bin/clipvault-sequential.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
